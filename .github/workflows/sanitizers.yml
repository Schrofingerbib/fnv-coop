# Linux-only checks that need no game: synccore and the simfuzz soak under ASan + UBSan (g++ and clang), plus the Python quick suite.
# Windows (MSVC x86) jobs live in their own workflow; nothing here touches game files or secrets.
name: sanitizers

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"      # weekly: a fresh block of seeds (see "Seed base")
  workflow_dispatch:
    inputs:
      seed_base:
        description: "first simfuzz seed (default: 1 on PRs and pushes, a date-based block on the weekly run)"
        required: false
      count:
        description: "sessions per simfuzz sweep (default 300)"
        required: false

permissions:
  contents: read

env:
  # -fno-sanitize-recover makes the first UBSan finding fail the process instead of printing and carrying on.
  SAN_FLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -O1 -g
  ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:abort_on_error=0
  UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

jobs:
  synccore-san:
    name: synccore tests, ASan+UBSan (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cxx: g++, cc: gcc }
          - { cxx: clang++, cc: clang }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5   # the drift_effect_table test calls python
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libenet-dev clang
      - name: Twin of the sanitizers themselves
        # A planted heap overflow and a planted signed overflow must make the process fail with these exact flags.
        # If this step passes while the lines below are "fixed", the sanitizers are not really on.
        run: |
          set -u
          printf 'int main(int c, char**) { int* p = new int[2]; p[c + 1] = 1; return p[0]; }\n' > twin_asan.cpp
          printf '#include <climits>\nint main(int c, char**) { int x = INT_MAX - 1 + c; return (x + 1) > 0; }\n' > twin_ubsan.cpp
          for t in twin_asan twin_ubsan; do
            ${{ matrix.cxx }} $SAN_FLAGS $t.cpp -o $t
            if ./$t; then echo "::error::$t exited 0: the sanitizer did not stop the planted bug"; exit 1; fi
          done
      - name: Configure
        run: >
          cmake -S synccore -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          "-DCMAKE_C_FLAGS=$SAN_FLAGS" "-DCMAKE_CXX_FLAGS=$SAN_FLAGS" "-DCMAKE_EXE_LINKER_FLAGS=$SAN_FLAGS"
      - run: cmake --build build --parallel
      # Excluded, each with its reason:
      #  - soak_smoke_threaded: about 15% flaky, a real worker-thread race (issue #43); ASan/UBSan do not see data races (that is TSan's job).
      #  - unit_perf / twin_perf_regression_still_fails: wall-clock budgets, meaningless at sanitizer speed.
      - run: ctest --test-dir build -j 4 --timeout 900 --output-on-failure -E '^(soak_smoke_threaded|unit_perf|twin_perf_regression_still_fails)$'

  simfuzz-soak:
    name: simfuzz soak, ASan+UBSan (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cxx: g++, cc: gcc }
          - { cxx: clang++, cc: clang }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Seed base
        # PRs and pushes use the same seeds every time (a red run can be reproduced exactly). The weekly run moves to a new block
        # each week; the seed it used is printed, and `fnvcoop_simfuzz --target em --seed N --count 1` replays one session.
        run: |
          if [ -n "${{ github.event.inputs.seed_base }}" ]; then base="${{ github.event.inputs.seed_base }}"
          elif [ "${{ github.event_name }}" = schedule ]; then base=$(( $(date +%s) / 604800 * 100000 + 1 ))
          else base=1; fi
          echo "SEED_BASE=$base" >> "$GITHUB_ENV"
          echo "COUNT=${{ github.event.inputs.count || 300 }}" >> "$GITHUB_ENV"
      - name: Configure (fuzzer, em and mini targets)
        run: >
          cmake -S synccore/fuzz -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          "-DCMAKE_CXX_FLAGS=$SAN_FLAGS" "-DCMAKE_EXE_LINKER_FLAGS=$SAN_FLAGS"
      - run: cmake --build build --parallel
      - name: Fuzzer unit tests (include the mutation twins and saved repros)
        run: ./build/fnvcoop_fuzz_tests --group fuzz
      - name: Twin of the soak
        # With a fault injected the sweep must fail; a soak that cannot fail proves nothing.
        run: |
          if ./build/fnvcoop_simfuzz --target em --bug no_dedupe --seed 1 --count 30 --no-shrink --quiet --out out/twin; then
            echo "::error::the soak passed with the no_dedupe fault injected"; exit 1
          fi
      - name: Soak (em, plain link)
        run: ./build/fnvcoop_simfuzz --target em --seed "$SEED_BASE" --count "$COUNT" --duration 8000 --out out/em-plain
      - name: Soak (em, bad_wifi)
        run: ./build/fnvcoop_simfuzz --target em --profile bad_wifi --seed "$SEED_BASE" --count "$COUNT" --duration 8000 --out out/em-badwifi
      - name: Soak (em, hell)
        run: ./build/fnvcoop_simfuzz --target em --profile hell --seed "$SEED_BASE" --count "$COUNT" --duration 8000 --out out/em-hell
      - name: Soak (mini)
        run: ./build/fnvcoop_simfuzz --target mini --seed "$SEED_BASE" --count "$(( COUNT * 3 ))" --duration 8000 --out out/mini
      - name: Keep shrunk repros and traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simfuzz-failures-${{ matrix.cxx }}
          path: out/
          if-no-files-found: ignore

  python-quick:
    name: python quick suite (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Suites that need the game, MSVC or a prebuilt DLL print "SKIP <name>: <reason>"; any FAIL fails the job.
      # ci.yml (#41) runs the same command on both OSes; this copy lets the sanitizer workflow stand alone and can go once #41 is merged.
      - run: python -I tools/test_all.py --quick
