# Linux-only, no game: synccore under ThreadSanitizer (g++ and clang). ASan/UBSan cannot see data races between the session and
# its worker thread (issue #43 was one); TSan can. Nothing here touches game files or secrets.
name: tsan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TSAN_FLAGS: -fsanitize=thread -fno-omit-frame-pointer -O1 -g
  # A report makes the process exit 66, so ctest fails the test; second_deadlock_stack prints both stacks of a lock-order report.
  TSAN_OPTIONS: second_deadlock_stack=1

jobs:
  synccore-tsan:
    name: synccore tests, TSan (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cxx: g++, cc: gcc }
          - { cxx: clang++, cc: clang }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5   # the drift_effect_table and relay tests call python
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libenet-dev clang
      # The runner's kernel randomizes mmap with 32 bits of entropy, which lands mappings where TSan keeps its shadow memory
      # ("FATAL: ThreadSanitizer: unexpected memory mapping"). 28 bits is the usual value and enough for TSan.
      - run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Twin of TSan itself
        # A planted data race must be reported (exit 66) with exactly these flags, or a green run below proves nothing.
        run: |
          set -u
          printf '#include <thread>\nint n = 0;\nint main() { std::thread a([] { for (int i = 0; i < 100000; ++i) ++n; });\n  std::thread b([] { for (int i = 0; i < 100000; ++i) ++n; });\n  a.join(); b.join(); return n == 0; }\n' > twin_tsan.cpp
          ${{ matrix.cxx }} $TSAN_FLAGS twin_tsan.cpp -o twin_tsan
          set +e; ./twin_tsan > twin_tsan.log 2>&1; rc=$?; set -e
          if [ "$rc" -ne 66 ] || ! grep -q "WARNING: ThreadSanitizer: data race" twin_tsan.log; then
            cat twin_tsan.log; echo "::error::the planted data race was not reported (exit $rc)"; exit 1
          fi
      - name: Configure
        run: >
          cmake -S synccore -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          "-DCMAKE_C_FLAGS=$TSAN_FLAGS" "-DCMAKE_CXX_FLAGS=$TSAN_FLAGS" "-DCMAKE_EXE_LINKER_FLAGS=$TSAN_FLAGS"
      - run: cmake --build build --parallel
      # Left out, with the reason: unit_perf / twin_perf_regression_still_fails / flight_perf have wall-clock budgets, meaningless at
      # TSan speed (5 to 15 times slower). Everything else must pass with no TSan report. Every report also goes to a file (log_path),
      # because a report inside a WILL_FAIL test (the twins) only makes it exit non-zero, which WILL_FAIL counts as the expected failure.
      - name: ctest (and no TSan report from any test, WILL_FAIL ones included)
        env:
          TSAN_OPTIONS: ${{ env.TSAN_OPTIONS }} log_path=${{ github.workspace }}/tsan-reports/tsan
        run: |
          # Twin: with exactly these options the planted race (built in the twin step above) must leave a report file.
          mkdir -p tsan-twin
          TSAN_OPTIONS="${TSAN_OPTIONS%% log_path=*} log_path=$PWD/tsan-twin/tsan" ./twin_tsan || true
          [ -n "$(ls -A tsan-twin)" ] || { echo "::error::the planted race left no report file: log_path does not work here"; exit 1; }
          mkdir -p tsan-reports
          rc=0
          ctest --test-dir build -j 4 --timeout 900 --output-on-failure -E '^(unit_perf|twin_perf_regression_still_fails|flight_perf)$' || rc=$?
          if [ -n "$(ls -A tsan-reports)" ]; then
            for f in tsan-reports/*; do echo "== $f"; head -60 "$f"; done
            echo "::error::$(ls tsan-reports | wc -l) TSan report file(s) written during ctest"; exit 1
          fi
          exit $rc
